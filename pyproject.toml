[project]
name = "ha-fritzbox-docsis"
version = "1.1.0"
description = "Home Assistant integration for the DOCSIS cable data of a FRITZ!Box Cable"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Stephan Seitz" }]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "ASYNC",         # async pitfalls
  "DTZ",           # naive datetimes
]
ignore = [
  "E501",    # line length is handled by the formatter
  "RUF001",  # German FRITZ!Box strings contain typographic quotes and dashes
  "RUF002",
  "RUF003",
  "RUF012",  # HA entity class attributes (_attr_*) are plain lists by convention
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ"]
"tools/*" = ["DTZ"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
