name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Deutsch ist auch völlig in Ordnung.
        **Please never post passwords or your MyFRITZ! address.**
  - type: input
    id: model
    attributes:
      label: FRITZ!Box model and FRITZ!OS version
      placeholder: e.g. FRITZ!Box 6591 Cable, FRITZ!OS 8.03
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Cable provider
      placeholder: e.g. Vodafone, Pŷur, NetCologne
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.10.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings › Devices & services › FRITZ!Box Cable (DOCSIS) › ⋮ › Download diagnostics,
        then drag the file here. Credentials are removed automatically.
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: See "Troubleshooting" in the README for how to enable debug logging.
      render: text
