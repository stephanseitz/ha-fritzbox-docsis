name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/fritzbox_docsis/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/fritzbox_docsis/manifest.json
      - name: Build ZIP
        run: |
          cd custom_components/fritzbox_docsis
          zip -r "$GITHUB_WORKSPACE/fritzbox_docsis.zip" . -x "__pycache__/*"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" fritzbox_docsis.zip --clobber
